<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>@font-face{font-family:H;src:url(/home/claude/fv/tools/Heebo.ttf)}*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:H}
.box{position:absolute;inset:0 26px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.25),transparent 45%),#14402a;box-shadow:-6px 0 0 #38e07b,6px 0 0 #38e07b}
.pitch{position:absolute;left:60px;right:60px;top:40px;bottom:40px;border:8px solid #fff;border-radius:28px;background:repeating-linear-gradient(0deg,#2bbf5c 0 120px,#25b052 120px 240px)}
.hl{position:absolute;left:0;right:0;top:50%;height:8px;background:#fff}.cc{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border:8px solid #fff;border-radius:50%}
.vid{position:absolute;left:60px;top:420px;width:960px;height:960px;border-radius:24px;border:8px solid #fff;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.t{position:absolute;left:0;right:0;top:140px;text-align:center}.t span{display:inline-block;background:#fff;color:#1d8a44;font-weight:900;font-size:86px;padding:6px 44px;border-radius:30px}
</style></head><body><div class="box"></div><div class="pitch"><div class="hl"></div><div class="cc"></div></div><div class="t"><span>נחשו את השחקן</span></div><div class="vid"></div></body></html>
