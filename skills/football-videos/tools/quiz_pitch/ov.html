<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>@font-face{font-family:H;src:url(/home/claude/fv/tools/Heebo.ttf)}*{margin:0;box-sizing:border-box}
html,body{background:transparent}body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:H}
.tm{position:absolute;left:0;right:0;top:1470px;text-align:center}.tm span{display:inline-block;background:#1d8a44;color:#fff;font-weight:900;font-size:110px;padding:0 50px;border-radius:30px;border:6px solid #fff;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:190px;right:190px;top:1650px;height:26px;border-radius:14px;background:rgba(0,0,0,.35);border:4px solid #fff;overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.hook{position:absolute;left:60px;right:60px;top:700px;text-align:center;font-weight:900;font-size:120px;line-height:1.1;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 0 40px rgba(56,224,123,.8);transform-origin:50% 50%}
.cd{position:absolute;left:0;right:0;top:620px;text-align:center;font-weight:900;font-size:420px;line-height:1;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 0 50px rgba(56,224,123,.9);transform-origin:50% 50%}
</style></head><body><div id="s"></div><script>
const T0=2.1,T1=12.1,CD=[['3',9.05],['2',10.05],['1',11.05]];
function render(t){let h='',k='';
 if(t<2.05){const p=Math.min(1,t/0.4),sc=p<1?2.2-1.2*(1-Math.pow(1-p,3)):1;h+=`<div class="hook" style="transform:scale(${sc.toFixed(3)})">נחשו את השחקן בעשר שניות!</div>`;k+='h'+sc.toFixed(3)}
 const left=t<T0?10:Math.max(0,T1-t),sec=Math.ceil(left-1e-6),fr=t<T0?1:left/(T1-T0);
 h+=`<div class="tm"><span>0:${String(sec).padStart(2,'0')}</span></div><div class="bar"><i style="width:${(fr*100).toFixed(1)}%"></i></div>`;k+='T'+sec+(fr*300|0);
 let c=null;for(const [n,ct] of CD) if(t>=ct&&t<T1) c=[n,ct];
 if(c){const x=Math.min(1,(t-c[1])/0.12);h+=`<div class="cd" style="opacity:${x.toFixed(2)};transform:scale(${(1.25-0.25*x).toFixed(3)})">${c[0]}</div>`;k+='c'+c[0]+x.toFixed(2)}
 document.getElementById('s').innerHTML=h;return k}
</script></body></html>
