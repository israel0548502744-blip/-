<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:H;src:url(fonts/Heebo.ttf);font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:H,sans-serif}
#stage{position:absolute;inset:0}
.hook{position:absolute;left:40px;right:40px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:900;font-size:150px;line-height:1.05;color:#fff;-webkit-text-stroke:14px #000;paint-order:stroke fill;
  text-shadow:0 0 38px rgba(56,224,123,.75),0 10px 30px rgba(0,0,0,.6)}
.cap{position:absolute;left:0;right:0;top:930px;display:flex;justify-content:center;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.2;color:#fff;
  text-shadow:0 0 3px #000,0 2px 4px rgba(0,0,0,.95),0 4px 14px rgba(0,0,0,.7)}
.cap .ln{transform-origin:50% 50%}.cap span{margin:0 9px;display:inline-block}
.cap .hl{color:#38e07b}.cap .hl2{color:#3ec6ff}
.card{position:absolute;left:60px;right:60px;bottom:1030px;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.65);transform-origin:50% 50%}
.card img{display:block;width:100%}
.pic{position:absolute;left:250px;right:250px;bottom:1030px;border-radius:26px;overflow:hidden;border:6px solid #38e07b;box-shadow:0 0 40px rgba(56,224,123,.55),0 24px 60px rgba(0,0,0,.65);transform-origin:50% 50%}
.pic img{display:block;width:100%}
.slipw{position:absolute;left:110px;right:110px;top:1110px;transform-origin:50% 50%}
.slip{border-radius:28px;overflow:hidden;border:3px solid rgba(255,255,255,.22);box-shadow:0 22px 50px rgba(0,0,0,.6)}
.slip img{display:block;width:100%}
.pred{position:relative;background:radial-gradient(ellipse at 50% -20%,rgba(255,255,255,.26),transparent 55%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 86px,transparent 86px 172px),linear-gradient(180deg,#0a3a23,#05200f);padding:28px 34px 34px;text-align:center;color:#fff}
.pred:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(255,255,255,.08)}
.pred>*{position:relative}
.pred .tag{display:inline-block;background:#062819;color:#9fe8bd;font-weight:800;font-size:34px;padding:4px 24px;border-radius:18px;margin-bottom:14px;border:2px solid rgba(255,255,255,.12)}
.pred .mt{font-weight:700;font-size:40px;color:#d7f7e4;margin-bottom:10px;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.pred .pk{font-weight:900;font-size:56px;line-height:1.15;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.6)}
.hook.calm{-webkit-text-stroke:10px #000;text-shadow:0 0 30px rgba(255,255,255,.35),0 10px 30px rgba(0,0,0,.6)}
/* story graphics: dt = date/place chip, sc = scoreboard, big = huge number/word (story videos only) */
.chip{position:absolute;left:0;right:0;top:300px;display:flex;justify-content:center;transform-origin:50% 50%}
.chip span{background:rgba(6,22,14,.9);border:4px solid #38e07b;border-radius:60px;padding:12px 44px;font-weight:800;font-size:56px;color:#fff;white-space:nowrap;
  box-shadow:0 0 30px rgba(56,224,123,.45),0 18px 40px rgba(0,0,0,.55)}
.sb{position:absolute;left:60px;right:60px;top:270px;display:flex;justify-content:center;transform-origin:50% 50%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.sb .tm{flex:1;min-width:0;background:rgba(6,22,14,.94);color:#fff;font-weight:800;font-size:52px;display:flex;align-items:center;justify-content:center;padding:16px 18px;white-space:nowrap;overflow:hidden}
.sb .tm.a{border-radius:0 26px 26px 0}.sb .tm.b{border-radius:26px 0 0 26px}
.sb .g{background:#38e07b;color:#06301a;font-weight:900;font-size:86px;line-height:1;width:118px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sb .g span{display:inline-block;transform-origin:50% 50%}
.sb .ds{background:#0b3a22;color:#38e07b;font-weight:900;font-size:60px;width:34px;display:flex;align-items:center;justify-content:center}
.big{position:absolute;left:30px;right:30px;top:450px;display:flex;justify-content:center;font-weight:900;font-size:230px;line-height:1.05;color:#fff;
  -webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 0 50px rgba(56,224,123,.8),0 12px 30px rgba(0,0,0,.6);white-space:nowrap;transform-origin:50% 50%}
.big .bi{display:inline-block;unicode-bidi:plaintext}
.wm{position:absolute;right:42px;top:78px;width:124px;height:124px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.logo{position:absolute;left:300px;width:480px;top:370px;transform-origin:50% 50%;filter:drop-shadow(0 0 40px rgba(56,224,123,.65)) drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.wa{position:absolute;left:80px;right:80px;top:560px;border-radius:32px;padding:34px 40px;display:flex;align-items:center;gap:30px;overflow:hidden;color:#fff;border:3px solid rgba(255,255,255,.22);
background:radial-gradient(ellipse at 50% -30%,rgba(255,255,255,.26),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 86px,transparent 86px 172px),linear-gradient(180deg,#0a3a23,#05200f);box-shadow:0 22px 50px rgba(0,0,0,.6);transform-origin:50% 50%}
.wa svg{flex:none;width:130px;height:130px}
.wa b{display:block;white-space:nowrap;font-size:58px;font-weight:900;line-height:1.05;text-shadow:0 4px 14px rgba(0,0,0,.6)}
.wa small{display:block;font-size:44px;font-weight:700;color:#9fe8bd;margin-top:8px}

#quiz{position:absolute;inset:0}
.qt{position:absolute;left:0;right:0;top:96px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
.qt b{font-weight:900;font-size:78px;color:#fff;background:linear-gradient(180deg,#0a3a23,#05200f);border:3px solid rgba(255,255,255,.22);border-radius:28px;padding:6px 40px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.qt small{font-weight:800;font-size:44px;color:#9fe8bd;margin-top:10px;text-shadow:0 3px 12px rgba(0,0,0,.8)}
.sil{position:absolute;left:330px;width:420px;top:330px;height:480px;transform-origin:50% 60%}
.sil svg{width:420px;height:480px;filter:drop-shadow(0 0 30px rgba(56,224,123,.35)) drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.qm{position:absolute;left:0;right:0;top:40px;text-align:center;font-weight:900;font-size:230px;color:#38e07b;text-shadow:0 0 40px rgba(56,224,123,.6);transform-origin:50% 50%}
.cd{color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 0 50px rgba(56,224,123,.9)}
.slots{position:absolute;left:40px;right:40px;top:1110px;display:grid;grid-template-columns:repeat(5,1fr);row-gap:26px;direction:rtl}
.sl{display:flex;flex-direction:column;align-items:center;gap:8px}
.cir{width:172px;height:172px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#124a2e,#05200f);border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.55);overflow:hidden}
.cir.on{background:#fff;border-color:#38e07b;box-shadow:0 0 26px rgba(56,224,123,.55),0 12px 30px rgba(0,0,0,.55)}
.cir img{width:128px;height:128px;object-fit:contain}
.cir i{font-style:normal;font-weight:900;font-size:64px;color:rgba(255,255,255,.25)}
.num{font-weight:900;font-size:34px;color:#06301a;background:#9fe8bd;border-radius:16px;padding:0 14px;min-width:46px;text-align:center}

.qt2{position:absolute;left:0;right:0;top:110px;text-align:center;font-weight:900;font-size:70px;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.85)}
.crb{position:absolute;left:0;right:0;top:330px;display:flex;justify-content:center;transform-origin:50% 50%}
.cw{width:500px;height:500px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.cw img{width:350px;height:350px;object-fit:contain}
.cdn{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:900;font-size:460px;line-height:1;color:#fff;text-shadow:0 10px 50px rgba(0,0,0,.8);transform-origin:50% 50%}
</style></head><body><div id="quiz"></div><div id="stage"></div>
<script>
let TL=null;
const stage=document.getElementById('stage');
function pop(p){ // 0..1 -> scale with overshoot
  if(p>=1)return 1; if(p<=0)return .55; const s=1.70158*1.3,x=p-1; return .55+.45*(1+(s+1)*x*x*x+s*x*x)}
let CH=[];let WA_SUB="הקישור בביו";
function setTL(tl){TL=tl;CH=[];let cur=null;TL.forEach(b=>{if('sc' in b)cur=b.sc||null;b._sc=cur});
  TL.forEach((b,bi)=>{if(bi===0)return;(b.phrases||[{words:b.words,end:b.end}]).forEach(ph=>{
    const ws=ph.words,n=Math.ceil(ws.length/3),size=Math.ceil(ws.length/n);   // balanced chunks of <=3 words
    for(let i=0;i<ws.length;i+=size){const part=ws.slice(i,i+size);const last=i+size>=ws.length;
      CH.push({words:part,t0:part[0].t,t1:last?ph.end:ws[i+size].t})}})})}
function render(t){
  let html='',key='';
  const hb=TL[0];
  if(t<hb.end+0.05&&hb.calm){const o=Math.min(1,t/0.8);   // calm hook (tragedy stories): slow fade, no punch zoom
    html+=`<div class="hook calm" style="opacity:${o.toFixed(2)}">${hb.vo}</div>`;key+='h'+o.toFixed(2)}
  else if(t<hb.end+0.05){const p=Math.min(1,t/0.42);const sc=p<1?2.4-1.4*(1-Math.pow(1-p,3)):1;const sc2=p<1?sc:(1+0.03*Math.sin((t-0.42)*6));
    html+=`<div class="hook" style="transform:scale(${sc2.toFixed(3)});opacity:${Math.min(1,p*2.5).toFixed(2)}">${hb.vo}</div>`;key+='h'+sc2.toFixed(3)}
  for(const b of TL){
    if(b.type==='hook')continue;
    if(b.m){const s=b.start,e=Math.max(b.end,s+1.6);if(t>=s&&t<e){const sc=pop((t-s)/0.35);
      html+=`<div class="card" style="transform:scale(${sc.toFixed(3)})"><img src="img/${b.m}"></div>`;key+='m'+b.m+sc.toFixed(3)}}
    // b.k = a story photo (e.g. a player with a trophy) that pops in when the voice starts this beat
    if(b.k){const s=b.start,e=Math.max(b.end,s+1.8);if(t>=s&&t<e){const sc=pop((t-s)/0.35);
      html+=`<div class="pic" style="transform:scale(${sc.toFixed(3)})"><img src="img/${b.k}"></div>`;key+='k'+b.k+sc.toFixed(3)}}
    if(b.s||b.p){const s=b.start+(b.m?0.35:0),e=b.end+0.25;if(t>=s&&t<e){const sc=pop((t-s)/0.35);
      // b.p = prediction card {match, pick} (no odds/stake); b.s = slip screenshot (legacy)
      const inner=b.p?`<div class="pred"><div class="tag">התחזית שלי</div><div class="mt">${b.p.match}</div><div class="pk">${b.p.pick}</div></div>`:`<img src="img/${b.s}">`;
      html+=`<div class="slipw" style="transform:scale(${sc.toFixed(3)})"><div class="slip">${inner}</div></div>`;key+='s'+(b.s||b.p.pick)+sc.toFixed(3)}}
    // story graphics. dt: "1966 · לונדון" chip; big: "149-0" huge text; sc: {"a":"ליברפול","b":"מילאן","ga":0,"gb":3}
    if(b.dt){const s=b.start,e=Math.max(b.end,s+2.2);if(t>=s&&t<e){const sc=pop((t-s)/0.35);
      html+=`<div class="chip" style="transform:scale(${sc.toFixed(3)})"><span>${b.dt}</span></div>`;key+='d'+b.dt+sc.toFixed(3)}}
    if(b.big){const i=TL.indexOf(b),s=b.start,e=TL[i+1]?Math.min(b.end+0.2,TL[i+1].start):b.end+0.5;if(t>=s&&t<e){const p=Math.min(1,(t-s)/0.3);const sc=p<1?2.0-(1-Math.pow(1-p,3)):1+0.025*Math.sin((t-s-0.3)*6);
      html+=`<div class="big" id="big" style="transform:scale(${sc.toFixed(3)});opacity:${Math.min(1,p*2).toFixed(2)}"><span class="bi">${b.big}</span></div>`;key+='B'+b.big+sc.toFixed(3)}}
    // scoreboard stays from its first beat until a beat sets "sc": false (or the end); each new score pops
    if(b._sc){const i=TL.indexOf(b),nx=TL[i+1],pv=TL[i-1],ps=pv&&pv._sc;const s=b.start,e=nx?(nx._sc?nx.start:b.end+0.4):b.end+0.7;
      if(t>=s&&t<e){const same=ps&&ps.a===b._sc.a&&ps.b===b._sc.b;const sc=same?1:pop((t-s)/0.35);
        const pz=(v,o)=>{if(!same||o===v)return 1;const q=Math.min(1,(t-s)/0.3);return q<1?1+0.9*(1-q)*(1-q):1};
        const za=pz(b._sc.ga,ps&&ps.ga),zb=pz(b._sc.gb,ps&&ps.gb);
        html+=`<div class="sb" style="transform:scale(${sc.toFixed(3)})"><div class="tm a">${b._sc.a}</div><div class="g"><span style="transform:scale(${za.toFixed(3)})">${b._sc.ga}</span></div><div class="ds">-</div><div class="g"><span style="transform:scale(${zb.toFixed(3)})">${b._sc.gb}</span></div><div class="tm b">${b._sc.b}</div></div>`;
        key+='S'+b._sc.ga+'_'+b._sc.gb+sc.toFixed(3)+za.toFixed(3)+zb.toFixed(3)}}
    if(b.logo){const s=b.start;if(t>=s){const sc=pop((t-s)/0.4);const br=1+0.025*Math.sin((t-s)*5);
      html+=`<img class="logo" src="img/logo.png" style="transform:scale(${(sc*br).toFixed(3)})">`;key+='L'+(sc*br).toFixed(3)}}
    if(b.wa){const s=b.start+0.15,e=b.end;if(t>=s&&t<e){const sc=pop((t-s)/0.35);
      html+=`<div class="wa" style="transform:scale(${sc.toFixed(3)})"><svg viewBox="0 0 100 100"><circle cx="50" cy="48" r="40" fill="#fff"/><path d="M22 86 L30 64 L44 78 Z" fill="#fff"/>
      <path d="M38 30c2-2 5-2 6 1l3 7c1 2 0 4-2 5l-2 2c2 5 6 9 11 11l2-2c1-2 3-3 5-2l7 3c3 1 3 4 1 6l-3 3c-4 4-14 1-23-8s-12-19-8-23z" fill="#25d366"/></svg>
      <div><b>קבוצת הוואטסאפ שלנו</b><small>${WA_SUB}</small></div></div>`;key+='w'+sc.toFixed(3)}}
  }
  // captions: whole line is laid out up front, words are only revealed -> nothing ever moves
  let ci=-1;for(let k=0;k<CH.length;k++)if(t>=CH[k].t0)ci=k;
  if(ci>=0){const c=CH[ci];const nxt=ci+1<CH.length?CH[ci+1].t0:1e9;const hide=Math.min(nxt,c.t1+0.45);
    if(t<hide){let rk='';
      // whole chunk appears at once (reference style), quick 80ms fade
      const o=Math.max(0,Math.min(1,(t-c.t0)/0.08));rk=o.toFixed(1);
      const sp=c.words.map(w=>`<span class="${w.hl?'hl':w.hl2?'hl2':''}">${w.w}</span>`).join(' ');
      html+=`<div class="cap" style="opacity:${o.toFixed(2)}"><div class="ln" id="cap">${sp}</div></div>`;key+='c'+ci+'_'+rk}}
  stage.innerHTML=html;
  const cap=document.getElementById('cap');if(cap){const w=cap.scrollWidth;if(w>940)cap.style.transform=`scale(${(940/w).toFixed(3)})`}
  const bg=document.getElementById('big');if(bg){const w=bg.firstChild.scrollWidth;if(w>1000)bg.firstChild.style.transform=`scale(${(1000/w).toFixed(3)})`}
  return key}
</script>
<script>
const QS=1.56, QE=27.02;
const CR=[['malmo',12.46],['ajax',13.96],['juve',14.72],['inter',15.65],['barca',16.33],['milan',17.27],['psg',17.97],['manutd',18.69],['galaxy',19.97],['milan',22.18]];
const CRE=23.34; const CD=[['3',25.36],['2',26.17],['1',26.6]];
const quiz=document.getElementById('quiz'); const R0=render;
render=function(t){const k=R0(t); let h='',qk='';
 if(t>=QS&&t<QE) {h+='<div class="qt2">נחשו מי השחקן</div>';qk+='T';}
 let cur=null; CR.forEach(([c,ct],i)=>{const e=i+1<CR.length?CR[i+1][1]:CRE; if(t>=ct&&t<e) cur=[c,ct]});
 if(cur){const x=Math.min(1,(t-cur[1])/0.12); const sc=1.18-0.18*x;
  h+=`<div class="crb" style="opacity:${x.toFixed(2)};transform:scale(${sc.toFixed(3)})"><div class="cw"><img src="img/${cur[0]}.png"></div></div>`; qk+=cur[0]+cur[1]+x.toFixed(2)}
 let cd=null; for(const [n,ct] of CD) if(t>=ct&&t<QE) cd=[n,ct];
 if(cd){const x=Math.min(1,(t-cd[1])/0.12); h+=`<div class="cdn" style="opacity:${x.toFixed(2)};transform:scale(${(1.18-0.18*x).toFixed(3)})">${cd[0]}</div>`; qk+='N'+cd[0]+x.toFixed(2)}
 quiz.innerHTML=h; return k+'|'+qk};
</script></body></html>
