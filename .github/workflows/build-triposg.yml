name: TripoSG for the NPU (experiment)

# Converts TripoSG (VAST-AI, MIT weights) into NPU graphs for the Snapdragon 8 Elite:
# export to ONNX in parts, check every part against PyTorch, compile each part into a QNN
# context binary, and publish the pack to the "triposg-v1" release. A separate job runs the
# whole pipeline on the CPU the way the app will (own scheduler loop, coarse-to-fine extraction)
# and publishes the reference mesh, so the phone's result can be compared with it.
on:
  workflow_dispatch:
    inputs:
      reference_steps:
        description: "Denoising steps for the CPU reference run (0 = skip)"
        default: "25"
  push:
    branches: ["**"]
    paths: ["convert/export_triposg.py", ".github/workflows/build-triposg.yml"]

permissions:
  contents: write

env:
  TRIPOSG_COMMIT: fc5c40990181e2a756c4e0b1c2f4d6b5202faf8c

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        parts: ["config,dino,vae", "dit0", "dit1", "dit2", "dit3", "dit4", "dit5", "dit6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Disk and swap
        run: |
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w
          sudo fallocate -l 16G /mnt/swap && sudo chmod 600 /mnt/swap && sudo mkswap /mnt/swap && sudo swapon /mnt/swap
          free -g; df -h / /mnt
      - name: Install
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" onnx onnxruntime diffusers==0.31.0 transformers==4.46.3 einops scikit-image \
            jaxtyping typeguard trimesh huggingface_hub safetensors omegaconf
      - name: Fetch TripoSG code and weights
        run: |
          git clone https://github.com/VAST-AI-Research/TripoSG /mnt/w/TripoSG
          git -C /mnt/w/TripoSG checkout $TRIPOSG_COMMIT
          head -5 /mnt/w/TripoSG/LICENSE
          python -c "from huggingface_hub import snapshot_download; snapshot_download('VAST-AI/TripoSG', local_dir='/mnt/w/weights')"
          du -sh /mnt/w/weights/*
          cat /mnt/w/weights/model_index.json /mnt/w/weights/scheduler/*.json /mnt/w/weights/feature_extractor_dinov2/*.json
      - name: Export and check against PyTorch
        run: /usr/bin/time -v python convert/export_triposg.py --repo /mnt/w/TripoSG --weights /mnt/w/weights --out /mnt/w/onnx --parts "${{ matrix.parts }}" 2>&1 | grep -v "^\s*\(Page\|Voluntary\|Involuntary\|Swaps\|File system\|Socket\|Signals\|Average\|Exit\|Minor\|Major\|Percent\|System time\|User time\)"
      - name: Compile for the NPU (Snapdragon 8 Elite, SM8750)
        run: |
          pip install onnxruntime-qnn==2.7.0
          mkdir -p /mnt/w/npu
          # Memory every 30 s, so a runner that dies while compiling shows why.
          (while true; do echo "mem: $(free -m | awk '/Mem/{print $3"MB used, "$7"MB avail"}') swap: $(free -m | awk '/Swap/{print $3"MB"}')"; sleep 30; done) &
          for m in /mnt/w/onnx/*.onnx; do
            /usr/bin/time -f "%e s, %M KB peak" python convert/compile_npu.py "$m" /mnt/w/npu --suffix _sm8750 --soc-model 69 --htp-arch 79 2>&1 | tail -5
          done
          cp /mnt/w/onnx/*.json /mnt/w/npu/ 2>/dev/null || true
          ls -la /mnt/w/npu
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view triposg-v1 >/dev/null 2>&1 || gh release create triposg-v1 --prerelease --latest=false \
            --title "TripoSG NPU pack (experiment)" \
            --notes "TripoSG (VAST-AI-Research, MIT) converted for the Snapdragon 8 Elite NPU. Experimental."
          gh release upload triposg-v1 /mnt/w/npu/* --clobber

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: github.event_name == 'workflow_dispatch' && inputs.reference_steps != '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Disk and swap
        run: |
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w
          sudo fallocate -l 16G /mnt/swap && sudo chmod 600 /mnt/swap && sudo mkswap /mnt/swap && sudo swapon /mnt/swap
      - name: Install
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" onnx onnxruntime diffusers==0.31.0 transformers==4.46.3 einops scikit-image \
            jaxtyping typeguard trimesh huggingface_hub safetensors scipy omegaconf
      - name: Fetch
        run: |
          git clone https://github.com/VAST-AI-Research/TripoSG /mnt/w/TripoSG
          git -C /mnt/w/TripoSG checkout $TRIPOSG_COMMIT
          python -c "from huggingface_hub import snapshot_download; snapshot_download('VAST-AI/TripoSG', local_dir='/mnt/w/weights')"
          curl -fsSL -o /mnt/w/isnet.onnx https://github.com/${GITHUB_REPOSITORY}/releases/download/extras-v1/isnet_general.onnx
      - name: CPU reference (app algorithm)
        run: |
          python convert/export_triposg.py --repo /mnt/w/TripoSG --weights /mnt/w/weights --out ref --parts "" \
            --reference /mnt/w/TripoSG/assets/example_data/hjswed.png --isnet /mnt/w/isnet.onnx --steps ${{ inputs.reference_steps }}
          ls -la ref
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view triposg-v1 >/dev/null 2>&1 || gh release create triposg-v1 --prerelease --latest=false \
            --title "TripoSG NPU pack (experiment)" --notes "Experimental."
          cd ref && for f in *; do cp "$f" "ref_$f"; done && gh release upload triposg-v1 ref_* --clobber
