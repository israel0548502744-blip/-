name: Export optional enhancement models

# Builds the optional "extras" packs (upscaler, stronger background removal, depth for
# lithophane/relief, tap-to-select) and publishes them to the "extras-v1" release.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["convert/export_extras.py", ".github/workflows/build-extras.yml"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" onnx onnxruntime transformers==4.46.3 timm==0.9.16
          pip install --no-deps git+https://github.com/ChaoningZhang/MobileSAM.git
      - name: Export and verify
        run: python convert/export_extras.py --out extras && ls -la extras
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view extras-v1 >/dev/null 2>&1 || gh release create extras-v1 --prerelease --latest=false \
            --title "Optional enhancement models (v1)" \
            --notes "Optional models the app can download from Settings. Licenses: Real-ESRGAN BSD-3-Clause, ISNet Apache-2.0, Depth Anything V2 Small Apache-2.0, MobileSAM Apache-2.0."
          gh release upload extras-v1 extras/*.onnx --clobber
