name: Build Makeo 3D Android APK

# Builds the small app (~30-40 MB). The 1.7 GB model is NOT in the APK: it is published
# once by build-models.yml and downloaded from inside the app.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Token that may write releases to the public repository (the code repository is private,
      # so the app reads its updates from there).
      PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download background-removal model (U2-Net-p, 4.6 MB, from rembg)
        run: curl -fsSL -o android/app/src/main/assets/u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Makeo3D.apk
          ls -la Makeo3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Makeo3D-apk
          path: Makeo3D.apk

      # gh CLI instead of softprops/action-gh-release: its current v2 fails here with a 403.
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.run_number }}
        run: |
          printf 'Install Makeo3D.apk on the phone (allow installing from unknown sources).\nThe AI models are downloaded from inside the app.\nBuilt from %s @ %s.\n' "${{ github.ref_name }}" "${{ github.sha }}" > notes.txt
          gh release create "$TAG" Makeo3D.apk --target "${{ github.sha }}" --title "Makeo 3D build ${{ github.run_number }}" \
            --notes-file notes.txt --latest

      - name: Publish to the public repository (where the app looks for updates)
        if: env.PUBLIC_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.PUBLIC_TOKEN }}
          TAG: apk-${{ github.run_number }}
        run: |
          gh release create "$TAG" Makeo3D.apk -R israel0548502744-blip/makeo3d-public \
            --title "Makeo 3D build ${{ github.run_number }}" --notes-file notes.txt --latest
